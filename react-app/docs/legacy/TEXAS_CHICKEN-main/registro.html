<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Chicken - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo" aria-label="Página de inicio de Texas Chicken">
            <span class="logo-badge">T</span>
            <span class="logo-text">Texas Chicken</span>
        </a>

        <button class="menu-toggle" id="mobile-menu" aria-label="Abrir menú de navegación"
            aria-expanded="false">☰</button>

        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menu.html">Menú</a></li>
            <li data-auth-link="login"><a href="login.html">Iniciar Sesión</a></li>
            <li data-auth-link="register"><a href="registro.html" class="active">Registrarse</a></li>
            <li><button id="logout-btn" class="btn-logout hidden">Cerrar Sesión</button></li>
        </ul>

        <div class="nav-right-actions">
            <div class="cart-container">
                <button class="btn-cart" id="cart-btn" aria-label="Carrito de compras">
                    🛒 <span class="cart-text-mobile-hide">Carrito</span> (<span id="cart-counter">0</span>)
                </button>
                <div class="cart-dropdown" id="cartDropdown">
                    <h4>Tu Pedido</h4>
                    <ul class="cart-items-list" id="cartItemsList"></ul>
                    <div class="cart-total">Total: Bs. <span id="cartTotal">0.00</span></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="form-container page-section">
            <h2>Crear Cuenta</h2>
            <form id="form-registro" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Juan Pérez">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="tu@email.com">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="reg-password" required placeholder="••••••••">
                        <button type="button" class="btn-toggle-password">Mostrar</button>
                    </div>
                    <span class="error-msg"></span>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <div class="register-redirect">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="copyright">
            &copy; 2026 Texas Chicken. Todos los derechos reservados.
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
